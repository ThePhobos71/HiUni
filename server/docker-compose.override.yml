# Nur für den Betrieb auf einem VPS ohne Coolify (wird von `docker compose up`
# automatisch geladen, von Coolify nicht): Port nur auf localhost, davor gehört
# ein Reverse-Proxy mit TLS. Die Variablen kommen wie unter Coolify aus der
# Umgebung, z.B. `export API_KEY=...` vor `docker compose up`.
services:
  fcm-tickle:
    ports:
      - "127.0.0.1:8000:8000"
