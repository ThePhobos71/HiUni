# Deploy über Coolify (Build Pack "Docker Compose"): kein Host-Port (Traefik
# routet über das Docker-Netz auf Port 8000), keine Dateien. Alle Werte kommen
# aus den Environment Variables der Coolify-Ressource, auch das Firebase-
# Service-Account-JSON (GOOGLE_APPLICATION_CREDENTIALS_JSON, am besten einzeilig).
#
# Für einen VPS ohne Coolify ergänzt docker-compose.override.yml den Port auf
# 127.0.0.1:8000. `docker compose up` lädt sie automatisch, Coolify nicht.
services:
  fcm-tickle:
    build: .
    restart: unless-stopped
    environment:
      # Pflicht: fehlt eine der beiden, bricht der Deploy mit Meldung ab.
      API_KEY: ${API_KEY:?API_KEY fehlt (openssl rand -hex 32)}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${GOOGLE_APPLICATION_CREDENTIALS_JSON:?Service-Account-JSON fehlt}
      # Optional, Defaults wie in app.py.
      TICKLE_INTERVAL_MINUTES: ${TICKLE_INTERVAL_MINUTES:-15}
      TICKLE_TYPE: ${TICKLE_TYPE:-sync_tickle}
      QUIET_HOURS: ${QUIET_HOURS:-off}
      TIMEZONE: ${TIMEZONE:-Europe/Berlin}
      TOKEN_MAX_AGE_DAYS: ${TOKEN_MAX_AGE_DAYS:-60}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-10}
      MAX_TOKENS: ${MAX_TOKENS:-5000}
    volumes:
      - tickle-data:/data
    expose:
      - "8000"

volumes:
  tickle-data:
