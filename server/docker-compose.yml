# Basis-Definition, so wie Coolify sie deployt (Build Pack "Docker Compose"):
# kein Host-Port (Traefik routet über das Docker-Netz auf Port 8000) und kein
# Datei-Mount für Firebase-Credentials (kommen als GOOGLE_APPLICATION_CREDENTIALS_JSON).
#
# Für einen VPS ohne Coolify ergänzt docker-compose.override.yml den Port auf
# 127.0.0.1:8000 und den Mount der service-account.json. `docker compose up`
# lädt die Override-Datei automatisch, Coolify ruft explizit nur diese Datei auf.
services:
  fcm-tickle:
    build: .
    restart: unless-stopped
    # Alle gesetzten Variablen aus .env (Coolify schreibt seine UI-Variablen
    # dorthin). Nicht gesetzte Variablen fehlen im Container, dann greifen die
    # Defaults aus app.py.
    env_file:
      - path: .env
        required: false
    # Explizit referenziert, damit Coolify die beiden Pflicht-Secrets in der
    # UI anzeigt. API_KEY fehlt → Deploy bricht mit klarer Meldung ab.
    environment:
      API_KEY: ${API_KEY:?API_KEY fehlt (openssl rand -hex 32)}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}
    volumes:
      - tickle-data:/data
    expose:
      - "8000"

volumes:
  tickle-data:
