function makeColors(hue, dark) {
  return {

/* ── RADIUS ENGINE ───────────────────────────────────────────────── */

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [view, setView] = useState('home');
  const [mails, setMails] = useState(INITIAL_MAILS);
  const [todos, setTodos] = useState(INITIAL_TODOS);
  const [mensaBalance, setMensaBalance] = useState(24.30);
  const [transactions, setTransactions] = useState(INITIAL_TX);
  const [groups, setGroups] = useState(INITIAL_GROUPS);
  const [notifs, setNotifs] = useState(INITIAL_NOTIFS);
  const [sports, setSports] = useState(INITIAL_SPORTS);
  const [bookingRoom, setBookingRoom] = useState(null);
  const [bibDay, setBibDay] = useState(0);
  const [bookings, setBookings] = useState([]);

  useEffect(() => {
    document.body.dataset.dark = tweaks.darkMode ? 'true' : 'false';
  }, [tweaks.darkMode]);

  const C  = makeColors(tweaks.accentHue, tweaks.darkMode);
  const CC = makeCourseColors(tweaks.accentHue, tweaks.darkMode);
  const R  = makeRadii(tweaks.cornerStyle);

  const navTabs = (tweaks.navTabs && tweaks.navTabs.length) ? tweaks.navTabs : ['home','stundenplan','mensa','bibliothek','kurse'];
  const navTab = navTabs.includes(view) ? view : null;
  const setNavTab = (id) => setView(id);

  const goto = (v) => setView(v);
  const goHome = () => setView('home');

  // Mail/Todo handlers
  const updateMail = (id, patch) => setMails(ms => ms.map(m => m.id === id ? { ...m, ...patch } : m));
  const toggleTodo = (id) => setTodos(ts => ts.map(t => t.id === id ? { ...t, done: !t.done } : t));
  const addTodo = (title) => setTodos(ts => [
    { id:Date.now(), title, courseId:null, courseLabel:null, due:null, dueColor:null, done:false },
    ...ts,
  ]);
  const topUpMensa = (amt) => {
    setMensaBalance(b => b + amt);
    setTransactions(tx => [
      { id:Date.now(), label:'Aufladung', date:'Heute · jetzt', amount: amt },
      ...tx,
    ]);
  };
  const toggleGroup = (id) => setGroups(gs => gs.map(g => g.id === id ? { ...g, joined: !g.joined, members: g.members + (g.joined ? -1 : 1) } : g));
  const markNotifRead = (id) => setNotifs(ns => ns.map(n => n.id === id ? { ...n, unread: false } : n));
  const markAllNotifsRead = () => setNotifs(ns => ns.map(n => ({ ...n, unread: false })));
  const toggleSport = (id) => setSports(ss => ss.map(s => {
    if (s.id !== id) return s;
    return { ...s, booked: !s.booked, spots: s.spots + (s.booked ? -1 : 1) };
  }));

  return (
    <div style={{ position:'relative' }}>
      {/* Phone */}
      <div style={{ width:390, height:844, background:C.surface, borderRadius:56, boxShadow:`0 0 0 1px ${tweaks.darkMode ? 'oklch(30% 0.02 260)' : 'oklch(75% 0.015 260)'}, 0 32px 80px ${tweaks.darkMode ? 'rgba(0,0,0,0.6)' : 'oklch(28% 0.08 260 / 0.3)'}`, overflow:'hidden', display:'flex', flexDirection:'column' }}>
        <StatusBar C={C} />
        <div className="scroll-area" key={view} style={{ flex:1, background:C.bg }}>
          {view === 'home'        && <HomeScreen        C={C} CC={CC} R={R} tweaks={tweaks} goto={goto}
                                       schedule={SCHEDULE} news={NEWS} todos={todos} kino={KINO} mails={mails} notifications={notifs} />}
          {view === 'stundenplan' && <StundenplanScreen C={C} CC={CC} R={R} schedule={SCHEDULE} />}
          {view === 'mensa'       && <MensaScreen       C={C} R={R} menus={MENSA_MENUS} />}
          {view === 'bibliothek'  && <BibliothekScreen  C={C} R={R} rooms={LIBRARY_ROOMS}
                                       bookings={bookings} bibDay={bibDay} setBibDay={setBibDay}
                                       onBookRoom={r => { setBookingRoom(r); setView('bibbooking'); }}
                                       onCancelBooking={id => setBookings(bs => bs.filter(b => b.id !== id))} />}
          {view === 'kurse'       && <KurseScreen       C={C} CC={CC} R={R} courses={COURSES} pastSemesters={PAST_SEMESTERS} currentSemester={tweaks.semester} />}
          {view === 'mail'        && <MailScreen        C={C} CC={CC} R={R} mails={mails} onBack={goHome} onUpdateMail={updateMail} />}
          {view === 'todo'        && <TodoScreen        C={C} CC={CC} R={R} todos={todos} onToggle={toggleTodo} onAdd={addTodo} onBack={goHome} />}
          {view === 'kino'        && <KinoScreen        C={C} R={R} kino={KINO} onBack={goHome} />}
          {view === 'profil'      && <ProfileScreen     C={C} CC={CC} R={R} tweaks={tweaks} mensaBalance={mensaBalance} goto={goto} onBack={goHome} />}
          {view === 'mensacard'   && <MensaCardScreen   C={C} R={R} balance={mensaBalance} transactions={transactions} onTopUp={topUpMensa} onBack={() => setView('profil')} />}
          {view === 'campus'      && <CampusScreen      C={C} R={R} onBack={goHome} />}
          {view === 'navsettings' && <NavSettingsScreen C={C} R={R} navTabs={navTabs} onChange={v => setTweak('navTabs', v)} onBack={() => setView('profil')} />}
          {view === 'lerngruppen' && <LerngruppenScreen C={C} CC={CC} R={R} groups={groups} onToggleJoin={toggleGroup} onBack={goHome} />}
          {view === 'klausuren'   && <KlausurenScreen   C={C} CC={CC} R={R} exams={EXAMS} onBack={goHome} />}
          {view === 'push'        && <PushScreen        C={C} R={R} notifications={notifs} onMarkRead={markNotifRead} onMarkAllRead={markAllNotifsRead} onBack={goHome} />}
          {view === 'sport'       && <SportScreen       C={C} R={R} sports={sports} onToggleBook={toggleSport} onBack={goHome} />}
          {view === 'noten'       && <NotenScreen       C={C} CC={CC} R={R}
                                       currentCourses={COURSES} pastSemesters={PAST_SEMESTERS}
                                       totalEctsRequired={180}
                                       gradeNotifEnabled={tweaks.gradeNotifEnabled}
                                       onToggleGradeNotif={v => setTweak('gradeNotifEnabled', v)}
                                       onBack={goHome} />}
          {view === 'bibbooking'  && bookingRoom && <LibraryBookingScreen C={C} R={R}
                                       room={bookingRoom} day={BIB_DAYS.find(d => d.id === bibDay)}
                                       onConfirm={(b) => { setBookings(bs => [...bs, b]); setView('bibliothek'); }}
                                       onBack={() => setView('bibliothek')} />}
        </div>
        <BottomNav activeTab={navTab} setActiveTab={setNavTab} navTabs={navTabs} C={C} />
      </div>

      {/* Tweaks panel */}
      <TweaksPanel>
        <TweakSection label="Akzentfarbe">
          <div style={{ display:'flex', gap:6, flexWrap:'wrap' }}>
            {[
              ['Indigo',265],['Blau',230],['Türkis',195],
              ['Grün',155],['Amber',75],['Rose',345],['Lila',300],
            ].map(([lbl, hue]) => (
              <div key={hue} className="tap" onClick={() => setTweak('accentHue', hue)} style={{ padding:'5px 11px', borderRadius:20, background: tweaks.accentHue === hue ? `oklch(40% 0.22 ${hue})` : 'rgba(0,0,0,0.06)', color: tweaks.accentHue === hue ? 'white' : '#444', fontSize:11, fontWeight:600 }}>
                {lbl}
              </div>
            ))}
          </div>
        </TweakSection>

        <TweakSection label="Persönlich">
          <TweakText label="Name" value={tweaks.studentName} onChange={v => setTweak('studentName', v)} />
          <TweakRadio label="Begrüßung" value={tweaks.greeting} options={['Hi','Hallo','Moin','Servus']} onChange={v => setTweak('greeting', v)} />
          <TweakRadio label="Semester" value={tweaks.semester} options={['Wintersemester 2025/26','Sommersemester 2026','Wintersemester 2026/27']} onChange={v => setTweak('semester', v)} />
        </TweakSection>

        <TweakSection label="Erscheinungsbild">
          <TweakToggle label="Dark Mode" value={tweaks.darkMode} onChange={v => setTweak('darkMode', v)} />
          <TweakToggle label="Kompakter Header" value={tweaks.compactCards} onChange={v => setTweak('compactCards', v)} />
          <TweakRadio  label="Ecken" value={tweaks.cornerStyle} options={['sharp','normal','round']} onChange={v => setTweak('cornerStyle', v)} />
        </TweakSection>

        <TweakSection label="Startseite — Sektionen">
          <TweakToggle label="Uni Kino" value={tweaks.showKino} onChange={v => setTweak('showKino', v)} />
          <TweakToggle label="Offene Aufgaben" value={tweaks.showTodo} onChange={v => setTweak('showTodo', v)} />
          <TweakToggle label="Neuigkeiten" value={tweaks.showNews} onChange={v => setTweak('showNews', v)} />
        </TweakSection>
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
