# JVM-Unit-Tests laufen bewusst OHNE die echte @HiltAndroidApp-Application.
# Deren onCreate() baut über DatabaseModule den echten Room-Stack via
# SQLCipher (System.loadLibrary("sqlcipher")) — die native Lib existiert auf
# der JVM nicht (UnsatisfiedLinkError). Die Tests bauen ihre DBs/Mocks selbst,
# daher genügt eine leere Stub-Application.
application=android.app.Application
sdk=33
